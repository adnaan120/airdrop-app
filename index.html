<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solve Captcha & Claim</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { background:#0a0c10; color:#fff; text-align:center; padding:30px 20px; }
        .step-bar { width:80px; height:4px; background:#222; margin:20px auto; border-radius:2px; display:flex; }
        .step-active { width:50%; height:100%; background:#0088cc; border-radius:2px; }
        .title { font-size:12px; color:#888; letter-spacing:1px; margin-bottom:25px; }
        .math-q { font-size:42px; font-weight:bold; margin-bottom:35px; color:#fff; }
        .btn-opt { display:block; width:100%; max-width:280px; margin:12px auto; padding:16px; background:#161922; color:#fff; font-size:20px; font-weight:bold; border:1px solid #2a2e3d; border-radius:12px; cursor:pointer; }
        .btn-opt:active { background:#0088cc; }
        .btn-ok { width:100%; max-width:280px; padding:16px; background:#0088cc; color:#fff; font-size:18px; font-weight:bold; border:none; border-radius:12px; margin-top:25px; cursor:pointer; }
    </style>
</head>
<body>

    <!-- Question 1 -->
    <div id="q1_screen">
        <div class="step-bar"><div class="step-active"></div></div>
        <div class="title">QUESTION 1 OF 2</div>
        <div class="math-q">17 + 8 = ?</div>
        <button class="btn-opt" onclick="wrong()">21</button>
        <button class="btn-opt" onclick="goQ2()">25</button>
        <button class="btn-opt" onclick="wrong()">23</button>
    </div>

    <!-- Question 2 -->
    <div id="q2_screen" style="display:none;">
        <div class="step-bar"><div class="step-active" style="width:100%;"></div></div>
        <div class="title">QUESTION 2 OF 2</div>
        <div class="math-q">35 − 15 = ?</div>
        <button class="btn-opt" onclick="goSuccess()">20</button>
        <button class="btn-opt" onclick="wrong()">18</button>
        <button class="btn-opt" onclick="wrong()">24</button>
    </div>

    <!-- Success Screen -->
    <div id="success_screen" style="display:none; padding-top:40px;">
        <div style="font-size:55px;">🎉</div>
        <h2 style="margin:15px 0;">Verified!</h2>
        <p style="color:#00ffaa; font-size:22px; font-weight:bold;">+0.0003 USDT</p>
        <p style="color:#888; margin-top:10px; font-size:13px;">Tap OK to collect and close.</p>
        <button class="btn-ok" onclick="closeApp()">OK</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function goQ2() {
            document.getElementById('q1_screen').style.display = 'none';
            document.getElementById('q2_screen').style.display = 'block';
        }

        function goSuccess() {
            document.getElementById('q2_screen').style.display = 'none';
            document.getElementById('success_screen').style.display = 'block';
        }

        function wrong() {
            alert("❌ Wrong answer! Try again.");
        }

        function closeApp() {
            // Halkan waxaa toos loogu xiraa Monetag SmartLink
            window.open("https://t.me/Alpha_Protocoll", "_blank");
            tg.close();
        }
    </script>
</body>
    </html>
